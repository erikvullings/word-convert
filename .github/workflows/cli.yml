name: Build portable CLI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64-baseline
            executable: wordconvert
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            executable: wordconvert
          - os: macos-15-intel
            target: bun-darwin-x64
            executable: wordconvert
          - os: macos-latest
            target: bun-darwin-arm64
            executable: wordconvert
          - os: windows-latest
            target: bun-windows-x64-baseline
            executable: wordconvert.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wordconvert/cli typecheck
      - run: pnpm exec vitest run apps/cli/src
      - run: pnpm cli:build
      - run: bun apps/cli/scripts/smoke.ts apps/cli/dist/${{ matrix.target }}/${{ matrix.executable }}
      - name: Package release bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release
          if [[ "$TARGET" == *windows* ]]; then
            python -c 'import shutil, os; t=os.environ["TARGET"]; shutil.make_archive("release/wordconvert-"+t, "zip", "apps/cli/dist", t)'
          else
            tar -czf "release/wordconvert-$TARGET.tar.gz" -C apps/cli/dist "$TARGET"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wordconvert-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish portable bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --pattern 'wordconvert-*' --dir artifacts
          mkdir release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          test "$(find release -type f | wc -l)" -eq 5
          (cd release && sha256sum * > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" release/* --verify-tag \
            --title "WordConvert CLI ${RELEASE_TAG#cli-v}" \
            --notes "Portable CLI bundles for macOS arm64/x64, Linux glibc arm64/x64, and Windows x64. Extract the complete archive and keep runtime/ beside wordconvert. No Bun or Node installation is needed. Model files download on first PDF use with a warning; use --offline or --no-layout to control downloads. Default output is EPUB. Binaries are unsigned. SHA-256 checksums are included."
