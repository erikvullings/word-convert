name: Build portable CLI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64-baseline
            executable: wordconvert
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            executable: wordconvert
          - os: macos-15-intel
            target: bun-darwin-x64
            executable: wordconvert
          - os: macos-latest
            target: bun-darwin-arm64
            executable: wordconvert
          - os: windows-latest
            target: bun-windows-x64-baseline
            executable: wordconvert.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wordconvert/cli typecheck
      - run: pnpm exec vitest run apps/cli/src
      - run: pnpm cli:build
      - run: bun apps/cli/scripts/smoke.ts apps/cli/dist/${{ matrix.target }}/${{ matrix.executable }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wordconvert-${{ matrix.target }}
          path: apps/cli/dist/${{ matrix.target }}/
          if-no-files-found: error
